name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # playwright is a devDependency only for regenerating the README
      # animations (npm run demo:gif). CI never captures frames, so skip the
      # ~130MB browser download on every run.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build
      - run: npm run size
      - run: npm run certify
      # Regenerating must be a no-op; a dirty tree means the checked-in
      # presets drifted from their specification.
      - run: npm run presets
      - run: git diff --exit-code src/presets
      - run: npm run bench
      - run: npm run pack:dry
