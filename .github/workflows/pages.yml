name: Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time, and never cancel one half-done: a cancelled Pages
# deployment can leave the site serving a partially uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The playground imports the package by name through a file: link, so it
      # resolves dist rather than src. Without this it builds against whatever
      # dist happens to be lying around, which in CI is nothing.
      - run: npm run build
      - run: npm ci --prefix playground
      - run: npm run build --prefix playground
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
