name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example time-aware-theme-v0.1.0'
        required: false
        type: string
  push:
    tags:
      - 'time-aware-theme-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          # Deliberately no registry-url. It makes setup-node write an .npmrc
          # containing //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and
          # point NPM_CONFIG_USERCONFIG at it. NODE_AUTH_TOKEN was removed when
          # publishing moved to OIDC trusted publishing, so npm sent an empty
          # bearer token and never reached the OIDC exchange. The registry
          # answers an unauthorized scoped PUT with 404, not 401, which made it
          # look like a missing package. npm defaults to registry.npmjs.org
          # anyway, so nothing is lost by omitting it.
      # Pinned so the release job is reproducible: this previously installed
      # npm@latest, so v0.1.0 and the v0.2.0 attempt silently ran on different
      # majors. Trusted publishing requires >= 11.5.1, but 11.19.0 does not
      # perform the OIDC token exchange at all — it reports ENEEDAUTH with no
      # credentials configured, even with id-token: write available and the
      # provenance signer able to obtain a token. 12.x is the line that
      # actually implements it. Upgrade deliberately, not per-run.
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: node scripts/check-release-version.mjs
        env:
          INPUT_TAG: ${{ inputs.tag }}
      - run: npm run build
      - run: npm test
      - run: npm publish
