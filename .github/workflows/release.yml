name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example time-aware-theme-v0.1.0'
        required: false
        type: string
  push:
    tags:
      - 'time-aware-theme-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          # registry-url makes setup-node write an .npmrc containing
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}. That is exactly
          # what we want when publishing with a token, and exactly what broke
          # OIDC publishing: with NODE_AUTH_TOKEN unset it sent an empty bearer
          # token, and the registry answers an unauthorized scoped PUT with 404
          # rather than 401. The two auth methods are mutually exclusive here.
          registry-url: 'https://registry.npmjs.org'
      # Pinned so the release job is reproducible. This previously installed
      # npm@latest, so v0.1.0 and the v0.2.0 attempts silently ran on different
      # majors, which made a publish failure much harder to diagnose.
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: node scripts/check-release-version.mjs
        env:
          INPUT_TAG: ${{ inputs.tag }}
      - run: npm run build
      - run: npm test
      # NODE_AUTH_TOKEN must be a granular access token created with
      # "bypass 2FA" enabled, otherwise the registry demands an interactive
      # OTP and this step cannot complete. See
      # https://docs.npmjs.com/requiring-2fa-for-package-publishing-and-settings-modification
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
